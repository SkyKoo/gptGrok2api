services:
  grok-browser:
    build:
      context: .
      dockerfile: grok-browser/Dockerfile
    image: ${GROK_BROWSER_IMAGE:-gptgrok2api-grok-browser:local}
    container_name: ${GROK_BROWSER_CONTAINER_NAME:-gptgrok2api-grok-browser}
    restart: unless-stopped
    environment:
      TURNSTILE_HEADLESS: ${GROK_BROWSER_HEADLESS:-0}
      GROK_BROWSER_CONCURRENCY: ${GROK_BROWSER_CONCURRENCY:-1}
      GROK_BROWSER_TOKEN: ${GROK_BROWSER_TOKEN:-}
    expose:
      - "8899"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8899/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  icloud-privacy-mail:
    profiles: ["local-icloud"]
    build:
      context: .
      dockerfile: deploy/icloud-privacy-mail/Dockerfile
    image: chatgpt2api/icloud-privacy-mail:local
    container_name: chatgpt2api-local-icloud-privacy-mail
    restart: unless-stopped
    environment:
      IPM_API_KEY: ${ICLOUD_PRIVACY_MAIL_API_KEY:-}
      IPM_PUBLIC_BASE_URL: ${ICLOUD_PRIVACY_MAIL_PUBLIC_BASE_URL:-http://icloud-privacy-mail:8787}
      IPM_UPDATE_ENABLED: "false"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/icloud-privacy-mail:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/login >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    container_name: chatgpt2api-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CFM_POSTGRES_DB:-cfm}
      POSTGRES_USER: ${CFM_POSTGRES_USER:-cfm}
      POSTGRES_PASSWORD: ${CFM_POSTGRES_PASSWORD:-change-me}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CFM_POSTGRES_USER:-cfm} -d ${CFM_POSTGRES_DB:-cfm}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt2api:local
    container_name: chatgpt2api-local
    ports:
      - "8000:80"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.json:/app/config.json
    environment:
      STORAGE_BACKEND: sqlite
      CFM_GROK_BROWSER_URL: ${CFM_GROK_BROWSER_URL:-http://grok-browser:8899}
      DATABASE_URL: sqlite:////app/data/accounts.db
      GO_DATABASE_URL: ${GO_DATABASE_URL:-postgresql://cfm:${CFM_POSTGRES_PASSWORD:-change-me}@postgres:5432/cfm?sslmode=disable}
      ICLOUD_PRIVACY_MAIL_BASE_URL: ${ICLOUD_PRIVACY_MAIL_BASE_URL:-http://icloud-privacy-mail:8787}
    depends_on:
      grok-browser:
        condition: service_started
      postgres:
        condition: service_healthy

    # 存储后端配置 (可选值: json, sqlite, postgres, git)
    # environment:
    #   STORAGE_BACKEND: json

    # 数据库配置 (当 STORAGE_BACKEND=sqlite/postgres 时使用)
    #   DATABASE_URL: postgresql://user:password@host:5432/dbname
    #   DATABASE_URL: sqlite:////app/data/accounts.db

    # Git 仓库配置 (当 STORAGE_BACKEND=git 时使用)
    #   GIT_REPO_URL: your-repository-url
    #   GIT_TOKEN: ghp_xxxxxxxxxxxx
    #   GIT_BRANCH: main
    #   GIT_FILE_PATH: accounts.json
    #   GIT_AUTH_KEYS_FILE_PATH: auth_keys.json

    # 认证密钥 (可选，覆盖 config.json)
    #   CHATGPT2API_AUTH_KEY: your_secret_key

    # 基础 URL (可选)
    #   CHATGPT2API_BASE_URL: https://your-domain.com

    # 安全兼容开关（默认关闭）
    #   CHATGPT2API_TRUST_REQUEST_HOST: "false"
    #   CHATGPT2API_ALLOW_PRIVATE_IMAGE_URLS: "false"
