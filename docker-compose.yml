services:
  grok-browser:
    build:
      context: .
      dockerfile: grok-browser/Dockerfile
    image: ${GROK_BROWSER_IMAGE:-gptgrok2api-grok-browser:local}
    container_name: ${GROK_BROWSER_CONTAINER_NAME:-gptgrok2api-grok-browser}
    restart: unless-stopped
    environment:
      TURNSTILE_HEADLESS: ${GROK_BROWSER_HEADLESS:-0}
      GROK_BROWSER_CONCURRENCY: ${GROK_BROWSER_CONCURRENCY:-1}
      GROK_BROWSER_TOKEN: ${GROK_BROWSER_TOKEN:-}
    expose:
      - "8899"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8899/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      default:
      cfm_warp: {}

  redis:
    image: redis:7-alpine
    container_name: gptgrok2api-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data

  postgres:
    image: postgres:17-alpine
    container_name: gptgrok2api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CFM_POSTGRES_DB:-cfm}
      POSTGRES_USER: ${CFM_POSTGRES_USER:-cfm}
      POSTGRES_PASSWORD: ${CFM_POSTGRES_PASSWORD:-change-me}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CFM_POSTGRES_USER:-cfm} -d ${CFM_POSTGRES_DB:-cfm}"]
      interval: 10s
      timeout: 5s
      retries: 10

  icloud-privacy-mail:
    profiles: ["local-icloud"]
    build:
      context: .
      dockerfile: deploy/icloud-privacy-mail/Dockerfile
    image: ${ICLOUD_PRIVACY_MAIL_IMAGE:-chatgpt2api/icloud-privacy-mail:2026.07.14.1}
    container_name: chatgpt2api-icloud-privacy-mail
    restart: unless-stopped
    environment:
      IPM_API_KEY: ${ICLOUD_PRIVACY_MAIL_API_KEY:-}
      IPM_PUBLIC_BASE_URL: ${ICLOUD_PRIVACY_MAIL_PUBLIC_BASE_URL:-http://icloud-privacy-mail:8787}
      IPM_UPDATE_ENABLED: "false"
      HTTP_PROXY: ${ICLOUD_PRIVACY_MAIL_HTTP_PROXY:-}
      HTTPS_PROXY: ${ICLOUD_PRIVACY_MAIL_HTTPS_PROXY:-}
      NO_PROXY: ${ICLOUD_PRIVACY_MAIL_NO_PROXY:-127.0.0.1,localhost,icloud-privacy-mail}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/icloud-privacy-mail:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/login >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${CHATGPT2API_IMAGE:-gptgrok2api-go:local}
    container_name: chatgpt2api
    restart: unless-stopped
    ports:
      - "${CHATGPT2API_PORT:-3000}:80"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.json:/app/config.json:ro
    environment:
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-}
      CHATGPT2API_ADMIN_KEY: ${CHATGPT2API_ADMIN_KEY:-}
      CHATGPT2API_WEBUI_KEY: ${CHATGPT2API_WEBUI_KEY:-}
      GO_CONFIG_PATH: ${GO_CONFIG_PATH:-/app/data/config.json}
      CFM_GROK_BROWSER_URL: ${CFM_GROK_BROWSER_URL:-http://grok-browser:8899}
      GO_PUBLIC_BASE_URL: ${GO_PUBLIC_BASE_URL:-}
      GO_TRUST_REQUEST_PUBLIC_BASE: ${GO_TRUST_REQUEST_PUBLIC_BASE:-false}
      GO_REQUEST_TIMEOUT_SECONDS: ${GO_REQUEST_TIMEOUT_SECONDS:-600}
      GO_CHAT_MAX_RETRIES: ${GO_CHAT_MAX_RETRIES:-2}
      GO_IMAGE_ACCOUNT_CONCURRENCY: ${GO_IMAGE_ACCOUNT_CONCURRENCY:-1}
      GO_IMAGE_MAX_CONCURRENCY: ${GO_IMAGE_MAX_CONCURRENCY:-128}
      GO_CHAT_RETRY_CODES: ${GO_CHAT_RETRY_CODES:-401,403,429,500,502,503}
      GO_ACCOUNT_REFRESH_CONCURRENCY: ${GO_ACCOUNT_REFRESH_CONCURRENCY:-3}
      GO_ALLOW_ANONYMOUS: ${GO_ALLOW_ANONYMOUS:-false}
      GO_QUEUE_BACKEND: ${GO_QUEUE_BACKEND:-redis}
      GO_DATABASE_URL: ${GO_DATABASE_URL:-postgresql://cfm:${CFM_POSTGRES_PASSWORD:-change-me}@postgres:5432/cfm?sslmode=disable}
      GO_REDIS_ADDR: ${GO_REDIS_ADDR:-redis:6379}
      GO_REDIS_PASSWORD: ${GO_REDIS_PASSWORD:-}
      GO_REDIS_DB: ${GO_REDIS_DB:-0}
      GO_PROXY_URL: ${GO_PROXY_URL:-}
      GO_PROXY_POOL: ${GO_PROXY_POOL:-}
      GO_RESOURCE_PROXY_URL: ${GO_RESOURCE_PROXY_URL:-}
      GO_RESOURCE_PROXY_POOL: ${GO_RESOURCE_PROXY_POOL:-}
      GO_ALLOW_PRIVATE_IMAGE_URLS: ${GO_ALLOW_PRIVATE_IMAGE_URLS:-false}
      GO_FLARESOLVERR_URL: ${GO_FLARESOLVERR_URL:-}
      GO_CLEARANCE_ENABLED: ${GO_CLEARANCE_ENABLED:-false}
      GO_CLEARANCE_TIMEOUT_SECONDS: ${GO_CLEARANCE_TIMEOUT_SECONDS:-60}
      ICLOUD_PRIVACY_MAIL_BASE_URL: ${ICLOUD_PRIVACY_MAIL_BASE_URL:-http://icloud-privacy-mail:8787}
      ICLOUD_PRIVACY_MAIL_API_KEY: ${ICLOUD_PRIVACY_MAIL_API_KEY:-}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      grok-browser:
        condition: service_started
    networks:
      default:
      cfm_warp: {}

networks:
  cfm_warp:
    external: true
    name: cfm-warp
